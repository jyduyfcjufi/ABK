name: OnePlus Ace5 Pro 全功能内核 (SukiSU + DroidSpaces)

# 独立自包含工作流：不依赖 oneplus-build.yml / get-manager.yml，
# 直接在 GitHub Actions 界面点 "Run workflow" 即可。
#
# 固定目标：
#   机型      OnePlus Ace 5 Pro (oneplus_ace5_pro_b)
#   系统      ColorOS / OxygenOS 16
#   CPU 分支  sm8750 (骁龙 8 至尊版)
#   KMI       android15 / 6.6
#   Root      SukiSU Ultra
#
# 默认全功能开启：SUSFS / KPM / lz4kd / BBR / 代理优化 /
#                Unicode 零宽绕过 / DroidSpaces 容器支持 / 用户命名空间
#
# 不含 BBG：BBG 与 KPM 都会改写 CONFIG_LSM，二者互斥，此工作流固定选 KPM。

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      enable_susfs:
        description: "SUSFS 挂载隐藏"
        required: false
        type: boolean
        default: true
      use_kpm:
        description: "KPM (KernelPatch 模块)"
        required: false
        type: boolean
        default: true
      use_lz4kd:
        description: "ZRAM lz4kd / lz4k_oplus 压缩算法"
        required: false
        type: boolean
        default: true
      use_bbr:
        description: "BBR 拥塞控制"
        required: false
        type: boolean
        default: true
      use_proxy_optimization:
        description: "代理网络优化 (ipset / netfilter 扩展)"
        required: false
        type: boolean
        default: true
      use_unicode_bypass:
        description: "Unicode 零宽字符绕过修复"
        required: false
        type: boolean
        default: true
      enable_droidspaces:
        description: "DroidSpaces 容器支持 (SYSVIPC / IPC_NS / PID_NS / mqueue)"
        required: false
        type: boolean
        default: true
      enable_user_ns:
        description: "用户命名空间 CONFIG_USER_NS (Docker rootless / NixOS 需要)"
        required: false
        type: boolean
        default: true
      kabi_slot:
        description: "DroidSpaces kABI 槽位，与 SUSFS 冲突时换一个 (678/123/345)"
        required: false
        type: choice
        options:
          - "678"
          - "123"
          - "345"
        default: "678"

env:
  CPU: sm8750
  DEVICE_MANIFEST: oneplus_ace5_pro_b
  DEVICE_NAME: "OnePlus Ace5 Pro"
  SYSTEM_VERSION: "ColorOS/OxygenOS 16"
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  KSU_VARIANT: SukiSU

jobs:
  # ==========================================================================
  # SukiSU 管理器 APK + SUSFS 模块
  # ==========================================================================
  manager:
    name: 下载 SukiSU 管理器与 SUSFS 模块
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 安装依赖
        run: sudo apt-get install -y jq curl unzip zip

      - name: 下载 SukiSU Ultra 管理器 APK
        id: manager_apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manager

          api() {
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }

          release_json=""
          for endpoint in \
            "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases/latest" \
            "https://api.github.com/repos/SukiSU-Ultra/SukiSU-Ultra/releases?per_page=1"; do
            candidate=""
            if candidate="$(api "$endpoint" 2>/dev/null)"; then
              # releases?per_page=1 返回数组，统一成对象
              if [ "$(echo "$candidate" | jq -r 'type')" = "array" ]; then
                candidate="$(echo "$candidate" | jq -r '.[0] // empty')"
              fi
              if [ -n "$candidate" ] && [ "$candidate" != "null" ]; then
                release_json="$candidate"
                break
              fi
            fi
          done

          if [ -z "$release_json" ]; then
            echo "::error::无法获取 SukiSU Ultra Release 信息"
            exit 1
          fi

          tag="$(echo "$release_json" | jq -r '.tag_name // "unknown"')"
          # artifact 名不允许 / \ : * ? " < > |
          safe_tag="$(printf '%s' "$tag" | sed 's#[^A-Za-z0-9._-]#_#g')"
          echo "SukiSU 管理器版本: $tag"
          echo "manager_tag=$safe_tag" >> "$GITHUB_OUTPUT"

          mapfile -t urls < <(
            echo "$release_json" |
              jq -r '.assets[]? | select(.name | endswith(".apk")) | .browser_download_url'
          )

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::error::该 Release 未包含 APK 资产"
            exit 1
          fi

          for url in "${urls[@]}"; do
            echo "下载 $(basename "$url")"
            curl -fL --retry 3 -o "manager/$(basename "$url")" "$url"
          done

          ls -lh manager/

      - name: 下载 SUSFS 模块
        id: susfs_module
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p susfs-module

          # 优先走 Release；该仓库的 Actions artifact 跨仓库无法用 GITHUB_TOKEN 读取
          release_json="$(
            curl -fsSL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest"
          )" || release_json=""

          if [ -z "$release_json" ]; then
            echo "::warning::无法获取 SUSFS 模块 Release，跳过。"
            exit 0
          fi

          url="$(
            echo "$release_json" |
              jq -r '.assets[]? | select(.name | endswith(".zip")) | .browser_download_url' |
              head -n 1
          )"

          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "::warning::SUSFS 模块 Release 无 zip 资产，跳过。"
            exit 0
          fi

          curl -fL --retry 3 -o "susfs-module/$(basename "$url")" "$url"
          ls -lh susfs-module/

      - name: 上传管理器 APK
        uses: actions/upload-artifact@v6
        with:
          name: SukiSU-Manager-${{ steps.manager_apk.outputs.manager_tag }}
          path: manager/*.apk
          if-no-files-found: error

      - name: 上传 SUSFS 模块
        if: steps.susfs_module.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: SUSFS-Module
          path: susfs-module/*.zip
          if-no-files-found: ignore

  # ==========================================================================
  # 内核构建
  # ==========================================================================
  build:
    name: Ace5 Pro · android15/6.6 · SukiSU
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ENABLE_SUSFS: ${{ inputs.enable_susfs }}
      USE_KPM: ${{ inputs.use_kpm }}
      USE_LZ4KD: ${{ inputs.use_lz4kd }}
      USE_BBR: ${{ inputs.use_bbr }}
      USE_PROXY_OPTIMIZATION: ${{ inputs.use_proxy_optimization }}
      USE_UNICODE_BYPASS: ${{ inputs.use_unicode_bypass }}
      ENABLE_DROIDSPACES: ${{ inputs.enable_droidspaces }}
      ENABLE_USER_NS: ${{ inputs.enable_user_ns }}
      KABI_SLOT: ${{ inputs.kabi_slot }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G

    steps:
      - name: 构建信息摘要
        shell: bash
        run: |
          set -euo pipefail

          device_label="${DEVICE_NAME} · ${SYSTEM_VERSION} · ${ANDROID_VERSION}/${KERNEL_VERSION} · ${CPU}"
          device_artifact_id="$(
            printf '%s' "$device_label" |
              sed 's#ColorOS/OxygenOS #COS-OOS#g; s#/#-#g; s# · #_#g; s# #_#g; s#[^A-Za-z0-9._-]#_#g'
          )"

          {
            echo "DEVICE_LABEL=$device_label"
            echo "DEVICE_ARTIFACT_ID=$device_artifact_id"
          } >> "$GITHUB_ENV"

          echo "========================================"
          echo "       内核构建配置摘要"
          echo "========================================"
          echo "构建目标        : OnePlus"
          echo "机型配置        : $device_label"
          echo "CPU 分支        : $CPU"
          echo "上游 XML        : $DEVICE_MANIFEST"
          echo "Android 版本    : $ANDROID_VERSION"
          echo "内核版本        : $KERNEL_VERSION"
          echo "KSU 变体        : $KSU_VARIANT"
          echo "SUSFS 状态      : $ENABLE_SUSFS"
          echo "KPM 功能        : $USE_KPM"
          echo "BBG 补丁        : 不启用（与 KPM 互斥）"
          echo "ZRAM lz4kd      : $USE_LZ4KD"
          echo "BBR             : $USE_BBR"
          echo "代理优化        : $USE_PROXY_OPTIMIZATION"
          echo "Unicode 绕过    : $USE_UNICODE_BYPASS"
          echo "DroidSpaces     : $ENABLE_DROIDSPACES (kABI 槽位 $KABI_SLOT)"
          echo "用户命名空间    : $ENABLE_USER_NS"
          echo "========================================"

      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: 安装依赖
        shell: bash
        run: |
          set -euo pipefail
          apt_update_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get update; then
                return 0
              fi
              echo "::warning::apt-get update 第 ${attempt} 次失败，清理索引后重试。"
              sudo apt-get clean || true
              sudo rm -rf /var/lib/apt/lists/*
              sleep "$attempt"
            done
            echo "::error::apt-get update 连续失败。"
            return 1
          }

          apt_update_retry
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            python3 git curl ccache libelf-dev build-essential flex bison libssl-dev \
            libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk \
            dos2unix zip gcc-aarch64-linux-gnu
          if ! command -v repo >/dev/null 2>&1; then
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o repo
            chmod a+x repo
            sudo mv repo /usr/local/bin/repo
          fi

      - name: 配置 ccache
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR="$HOME/.ccache_ace5pro_droidspaces"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z

      - name: 恢复 ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache_ace5pro_droidspaces
          key: ace5pro-ds-ccache-${{ runner.os }}-${{ inputs.enable_susfs }}-${{ inputs.enable_droidspaces }}
          restore-keys: |
            ace5pro-ds-ccache-${{ runner.os }}-

      - name: 同步 OnePlus 内核源码
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "abk-builder"
          git config --global user.email "abk-builder@users.noreply.github.com"
          rm -rf oneplus_workspace
          mkdir -p oneplus_workspace/kernel_workspace
          cd oneplus_workspace/kernel_workspace
          repo init -u https://github.com/Xiaomichael/kernel_manifest.git \
            -b "refs/heads/oneplus/${CPU}" \
            -m "${DEVICE_MANIFEST}.xml" \
            --depth=1
          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --force-sync

      - name: 准备 SukiSU 和补丁
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE/oneplus_workspace"
          KERNEL_ROOT="$WORKSPACE/kernel_workspace/kernel_platform"
          COMMON_ROOT="$KERNEL_ROOT/common"

          rm -f "$COMMON_ROOT"/android/abi_gki_protected_exports_* || true
          rm -f "$KERNEL_ROOT"/msm-kernel/android/abi_gki_protected_exports_* || true
          for script in \
            "$COMMON_ROOT/scripts/setlocalversion" \
            "$KERNEL_ROOT/msm-kernel/scripts/setlocalversion" \
            "$KERNEL_ROOT/external/dtc/scripts/setlocalversion"; do
            [ -f "$script" ] || continue
            sed -i 's/ -dirty//g' "$script"
          done

          cd "$KERNEL_ROOT"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s builtin

          cd "$WORKSPACE"
          rm -rf kernel_patches SukiSU_patch susfs4oki
          git clone https://github.com/Xiaomichael/kernel_patches.git --depth=1
          git clone https://github.com/ShirkNeko/SukiSU_patch.git --depth=1
          if [ "$ENABLE_SUSFS" = "true" ]; then
            git clone https://github.com/cctv18/susfs4oki.git \
              -b "oki-${ANDROID_VERSION}-${KERNEL_VERSION}" \
              --depth=1
          fi

          cp "$WORKSPACE/kernel_patches/zram_patches/001-lz4.patch" "$COMMON_ROOT/"
          cp "$WORKSPACE/kernel_patches/zram_patches/lz4armv8.S" "$COMMON_ROOT/lib/"
          cp "$WORKSPACE/kernel_patches/zram_patches/002-zstd.patch" "$COMMON_ROOT/"

          cd "$KERNEL_ROOT"
          if [ "$USE_LZ4KD" = "true" ]; then
            cp -r "$WORKSPACE"/SukiSU_patch/other/zram/lz4k/include/linux/* "$COMMON_ROOT/include/linux/" || true
            cp -r "$WORKSPACE"/SukiSU_patch/other/zram/lz4k/lib/* "$COMMON_ROOT/lib/" || true
            cp -r "$WORKSPACE"/SukiSU_patch/other/zram/lz4k/crypto/* "$COMMON_ROOT/crypto/" || true
            cp -r "$WORKSPACE"/SukiSU_patch/other/zram/lz4k_oplus "$COMMON_ROOT/lib/" || true
            cp "$WORKSPACE/SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION}/lz4kd.patch" "$COMMON_ROOT/" || true
            cp "$WORKSPACE/SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION}/lz4k_oplus.patch" "$COMMON_ROOT/" || true
          fi

          if [ "$ENABLE_SUSFS" = "true" ]; then
            cp "$WORKSPACE/susfs4oki/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" "$COMMON_ROOT/" || true
            cp "$WORKSPACE"/susfs4oki/kernel_patches/fs/* "$COMMON_ROOT/fs/" || true
            cp "$WORKSPACE"/susfs4oki/kernel_patches/include/linux/* "$COMMON_ROOT/include/linux/" || true
          else
            if [ -f "$WORKSPACE/kernel_patches/sukisu/scope_min_manual_hooks_v1.9.patch" ]; then
              cp "$WORKSPACE/kernel_patches/sukisu/scope_min_manual_hooks_v1.9.patch" "$COMMON_ROOT/"
            else
              cp "$WORKSPACE/kernel_patches/sukisu/scope_min_manual_hooks_v1.6.patch" "$COMMON_ROOT/"
            fi
          fi

          if [ "$USE_UNICODE_BYPASS" = "true" ]; then
            cp "$WORKSPACE/kernel_patches/common/unicode_bypass_fix_6.1+.patch" "$COMMON_ROOT/unicode_bypass_fix.patch" || true
          fi

          cd "$COMMON_ROOT"
          for patch_file in scope_min_manual_hooks_v1.9.patch scope_min_manual_hooks_v1.6.patch unicode_bypass_fix.patch; do
            [ -f "$patch_file" ] && patch -p1 < "$patch_file" || true
          done
          if [ "$USE_LZ4KD" = "true" ]; then
            [ -f lz4kd.patch ] && patch -p1 < lz4kd.patch || true
            [ -f lz4k_oplus.patch ] && patch -p1 < lz4k_oplus.patch || true
          else
            [ -f 001-lz4.patch ] && git apply -p1 < 001-lz4.patch || true
          fi
          if [ "$ENABLE_SUSFS" = "true" ]; then
            [ -f "50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" ] && \
              patch -p1 < "50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" || true
          fi

      - name: 修复 SukiSU SUSFS 源码兼容
        if: ${{ inputs.enable_susfs }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_ROOT="$GITHUB_WORKSPACE/oneplus_workspace/kernel_workspace/kernel_platform"

          KSU_BUILD_DIR=""
          for dir in common/drivers/kernelsu drivers/kernelsu KernelSU/kernel kernel; do
            if [ -d "$KERNEL_ROOT/$dir" ]; then
              KSU_BUILD_DIR="$KERNEL_ROOT/$dir"
              break
            fi
          done

          if [ -z "$KSU_BUILD_DIR" ]; then
            echo "::error::未找到 SukiSU 源码目录，无法修复 SUSFS 兼容。"
            exit 1
          fi

          python3 - "$KSU_BUILD_DIR" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          selinux_hide = root / "feature" / "selinux_hide.c"
          rules_c = root / "selinux" / "rules.c"

          if selinux_hide.exists():
              path = selinux_hide
              text = path.read_text()
              original = text
              replacements = [
                  ("static struct selinux_state fake_state;", "struct selinux_state fake_state;"),
                  (
                      "static bool ksu_selinux_hide_running __read_mostly = false;",
                      "bool ksu_selinux_hide_running __read_mostly = false;",
                  ),
                  ("static int security_context_to_sid_with_policy(", "int security_context_to_sid_with_policy("),
                  ("static int security_sid_to_context_with_policy(", "int security_sid_to_context_with_policy("),
                  (
                      "static void __nocfi security_compute_av_user_with_policy(",
                      "void __nocfi security_compute_av_user_with_policy(",
                  ),
                  ("static void security_compute_av_user_with_policy(", "void security_compute_av_user_with_policy("),
                  ("static struct selinux_policy *backup_sepolicy;", "struct selinux_policy *backup_sepolicy;"),
              ]
              for old, new in replacements:
                  text = text.replace(old, new)

              if text != original:
                  path.write_text(text)
                  print(f"patched {path}")
              else:
                  print(f"no change for {path}")

              final_text = path.read_text()
              forbidden = (
                  "static struct selinux_state fake_state;",
                  "static bool ksu_selinux_hide_running __read_mostly = false;",
                  "static int security_context_to_sid_with_policy(",
                  "static int security_sid_to_context_with_policy(",
                  "static void __nocfi security_compute_av_user_with_policy(",
                  "static void security_compute_av_user_with_policy(",
              )
              present = [marker for marker in forbidden if marker in final_text]
              if present:
                  raise SystemExit(f"{path} still contains non-exported SELinux compatibility symbols: {present}")
          elif rules_c.exists():
              path = rules_c
              text = path.read_text()
              original = text
              marker = "/* ABK: OnePlus builtin SUSFS SELinux compatibility globals. */"
              if marker not in text:
                  block = "\n".join([
                      "",
                      marker,
                      "#ifdef CONFIG_KSU_SUSFS",
                      "struct selinux_policy *backup_sepolicy;",
                      "#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 6, 0)",
                      "int security_context_to_sid_with_policy(struct selinux_policy *policy, const char *scontext, u32 scontext_len,",
                      "                                        u32 *sid, u32 def_sid, unsigned int gfp_flags)",
                      "{",
                      "    return -22;",
                      "}",
                      "int security_sid_to_context_with_policy(struct selinux_policy *policy, u32 sid, char **scontext,",
                      "                                        u32 *scontext_len)",
                      "{",
                      "    return -22;",
                      "}",
                      "void security_compute_av_user_with_policy(struct selinux_policy *policy, u32 ssid, u32 tsid, u16 tclass,",
                      "                                          struct av_decision *avd)",
                      "{",
                      "}",
                      "#endif",
                      "#endif",
                      "",
                  ])
                  anchor = "#define ALL NULL\n"
                  if anchor not in text:
                      raise SystemExit(f"{path} missing insertion anchor: {anchor.strip()}")
                  text = text.replace(anchor, anchor + block, 1)

              if text != original:
                  path.write_text(text)
                  print(f"patched {path}")
              else:
                  print(f"no change for {path}")

              final_text = path.read_text()
              required = (
                  "struct selinux_policy *backup_sepolicy;",
                  "int security_context_to_sid_with_policy(",
                  "int security_sid_to_context_with_policy(",
                  "void security_compute_av_user_with_policy(",
              )
              missing = [marker for marker in required if marker not in final_text]
              if missing:
                  raise SystemExit(f"{path} missing OnePlus builtin SELinux compatibility markers: {missing}")
          else:
              raise SystemExit(f"{root} does not contain a supported SELinux compatibility source file")
          PY

      - name: 修复 SukiSU sulog 兼容
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_ROOT="$GITHUB_WORKSPACE/oneplus_workspace/kernel_workspace/kernel_platform"

          KSU_BUILD_DIR=""
          for dir in common/drivers/kernelsu drivers/kernelsu KernelSU/kernel; do
            if [ -d "$KERNEL_ROOT/$dir" ]; then
              KSU_BUILD_DIR="$KERNEL_ROOT/$dir"
              break
            fi
          done

          if [ -z "$KSU_BUILD_DIR" ]; then
            echo "::warning::未找到 SukiSU 编译目录，跳过 sulog 兼容修复。"
            exit 0
          fi

          python3 - "$KSU_BUILD_DIR/sulog/event.c" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          if not path.exists():
              raise SystemExit(0)

          text = path.read_text()
          marker = "builtin SUSFS ksu_sulog_capture() expects argv_user as a pointer"
          new = "\n".join([
              "    /* ABK: builtin SUSFS ksu_sulog_capture() expects argv_user as a pointer. */",
              "#ifdef CONFIG_KSU_SUSFS",
              "    pending = ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, NULL, gfp);",
              "#else",
              "    pending = ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, USER_ARG_NULL, gfp);",
              "#endif",
          ])

          changed = False
          if marker not in text:
              for old in (
                  "    pending = ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, USER_ARG_NULL, gfp);",
                  "    pending = ksu_sulog_capture(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, &USER_ARG_NULL, gfp);",
              ):
                  if old in text:
                      text = text.replace(old, new, 1)
                      changed = True
                      break

          if changed:
              path.write_text(text)
              print(f"patched {path}")
          else:
              print(f"no change for {path}")

          final_text = path.read_text()
          incompatible = re.search(
              r"pending = ksu_sulog_capture\(KSU_SULOG_EVENT_IOCTL_GRANT_ROOT, NULL, &?USER_ARG_NULL, gfp\);",
              final_text,
          )
          if incompatible and marker not in final_text:
              raise SystemExit(f"{path} still contains incompatible ksu_sulog_capture grant_root argv call")
          PY

      - name: 注入 SukiSU KPM Kconfig
        if: ${{ inputs.use_kpm }}
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_ROOT="$GITHUB_WORKSPACE/oneplus_workspace/kernel_workspace/kernel_platform"

          KSU_KERNEL_DIR=""
          for dir in common/drivers/kernelsu drivers/kernelsu KernelSU/kernel kernel; do
            if [ -f "$KERNEL_ROOT/$dir/Kconfig" ]; then
              KSU_KERNEL_DIR="$KERNEL_ROOT/$dir"
              break
            fi
          done

          if [ -z "$KSU_KERNEL_DIR" ]; then
            echo "::error::未找到 SukiSU Kconfig，无法注入 KPM Kconfig 符号。"
            exit 1
          fi

          echo "ABK_KPM_KCONFIG_PATH=$KSU_KERNEL_DIR/Kconfig" >> "$GITHUB_ENV"

          python3 - "$KSU_KERNEL_DIR/Kconfig" "$GITHUB_ENV" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          github_env = Path(sys.argv[2])
          text = path.read_text()
          pattern = re.compile(r"(?m)^[ \t]*config[ \t]+KPM\b")
          if pattern.search(text):
              with github_env.open("a", encoding="utf-8") as handle:
                  handle.write("ABK_KPM_KCONFIG_STATUS=native\n")
                  handle.write("ABK_KPM_KCONFIG_READY=true\n")
              print(f"{path} 已包含 KPM Kconfig 符号")
              raise SystemExit(0)

          lines = [
              "",
              'menu "KernelSU - KPM"',
              "config KPM",
              '  bool "KernelPatch Module support"',
              "  depends on KSU",
              "  default y",
              "",
              "endmenu",
          ]
          block = "\n".join(lines)

          marker = "\nendmenu\n"
          if marker in text:
              text = text.rsplit(marker, 1)[0].rstrip() + "\n" + block + marker
          else:
              text = text.rstrip() + "\n" + block + "\n"
          path.write_text(text)

          final_text = path.read_text()
          if not pattern.search(final_text):
              raise SystemExit(f"{path} 注入后仍缺少 config KPM")

          with github_env.open("a", encoding="utf-8") as handle:
              handle.write("ABK_KPM_KCONFIG_STATUS=injected\n")
              handle.write("ABK_KPM_KCONFIG_READY=true\n")
          print(f"已注入 {path} 的 KPM Kconfig 符号")
          PY

      # ======================================================================
      # DroidSpaces：kABI 兼容补丁
      # 6.6 属于 below-6.12 分支，启用 CONFIG_SYSVIPC 会撑破 task_struct 的
      # kABI，必须借用 ANDROID_KABI_RESERVE 槽位存放 sysvsem / sysvshm。
      # ======================================================================
      - name: 克隆 DroidSpaces 补丁仓库
        if: ${{ inputs.enable_droidspaces }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/droidspaces
          git clone --depth 1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/droidspaces
          echo "DROIDSPACES_PATCHES=/tmp/droidspaces/Documentation/resources/kernel-patches/GKI" >> "$GITHUB_ENV"

      - name: 应用 DroidSpaces kABI 补丁
        if: ${{ inputs.enable_droidspaces }}
        shell: bash
        working-directory: oneplus_workspace/kernel_workspace/kernel_platform/common
        run: |
          set -euo pipefail

          fail() {
            echo "::error::DroidSpaces: $*"
            exit 1
          }

          try_apply_patch() {
            local patch_file="$1"
            local name
            name="$(basename "$patch_file")"
            [ -f "$patch_file" ] || return 1
            if patch -p1 --forward --dry-run < "$patch_file" >/dev/null 2>&1; then
              patch -p1 --forward < "$patch_file"
              echo "已应用 DroidSpaces patch: $name"
              return 0
            fi
            if patch -p1 --reverse --dry-run < "$patch_file" >/dev/null 2>&1; then
              echo "DroidSpaces patch 已应用过: $name"
              return 0
            fi
            return 1
          }

          # 上游 patch 打不上时（OnePlus 源码常与 AOSP common 有偏移），
          # 按所选槽位手工注入等价的 kABI 改写
          apply_sysvipc_kabi_fallback() {
            local sched="include/linux/sched.h"
            [ -f "$sched" ] || fail "缺少 $sched"

            if grep -qF "ANDROID_KABI_USE(${SLOT_A}, struct sysv_sem sysvsem);" "$sched"; then
              echo "SYSVIPC kABI fallback 已应用（槽位 ${KABI_SLOT}）"
              return 0
            fi

            grep -qF "ANDROID_KABI_RESERVE(${SLOT_A});" "$sched" \
              || fail "task_struct 中不存在 ANDROID_KABI_RESERVE(${SLOT_A})，请换一个 kABI 槽位"

            # 注释掉原生字段，避免与借槽后的定义重复
            perl -0pi -e 's/#ifdef CONFIG_SYSVIPC\n\tstruct sysv_sem\s+sysvsem;\n\tstruct sysv_shm\s+sysvshm;\n#endif/#ifdef CONFIG_SYSVIPC\n\t\/\/ struct sysv_sem\t\t\tsysvsem;\n\t\/\/ struct sysv_shm\t\t\tsysvshm;\n#endif/s' "$sched"

            perl -0pi -e '
              my ($sa, $sb, $sc) = ($ENV{SLOT_A}, $ENV{SLOT_B}, $ENV{SLOT_C});
              my $old = "\tANDROID_KABI_RESERVE($sa);\n\tANDROID_KABI_RESERVE($sb);\n\tANDROID_KABI_RESERVE($sc);";
              my $new = "\n#ifdef CONFIG_SYSVIPC\n\tANDROID_KABI_USE($sa, struct sysv_sem sysvsem);\n\t_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE($sb); ANDROID_KABI_RESERVE($sc), struct sysv_shm sysvshm);\n#else\n\tANDROID_KABI_RESERVE($sa);\n\tANDROID_KABI_RESERVE($sb);\n\tANDROID_KABI_RESERVE($sc);\n#endif";
              s/\Q$old\E/$new/s;
            ' "$sched"

            grep -qF '// struct sysv_sem' "$sched" || fail "SYSVIPC 原字段注释失败"
            grep -qF "ANDROID_KABI_USE(${SLOT_A}, struct sysv_sem sysvsem);" "$sched" \
              || fail "SYSVIPC kABI 注入失败，槽位 ${KABI_SLOT} 可能已被 SUSFS 等补丁占用，请换 678/123/345 中的其他值"
            echo "已应用 SYSVIPC kABI fallback（槽位 ${KABI_SLOT}）"
          }

          SLOT_A="${KABI_SLOT:0:1}"
          SLOT_B="${KABI_SLOT:1:1}"
          SLOT_C="${KABI_SLOT:2:1}"
          export SLOT_A SLOT_B SLOT_C

          SLOT_NAME="${SLOT_A}_${SLOT_B}_${SLOT_C}"
          PATCH_FILE="$DROIDSPACES_PATCHES/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_${SLOT_NAME}.patch"

          if ! try_apply_patch "$PATCH_FILE"; then
            echo "上游 patch 无法直接应用，改用手工 kABI 注入。"
            apply_sysvipc_kabi_fallback
          fi

      - name: 配置 defconfig
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE/oneplus_workspace"
          KERNEL_ROOT="$WORKSPACE/kernel_workspace/kernel_platform"
          COMMON_ROOT="$KERNEL_ROOT/common"
          DEFCONFIG_PATH="$COMMON_ROOT/arch/arm64/configs/gki_defconfig"
          kpm_kconfig_status="${ABK_KPM_KCONFIG_STATUS:-unknown}"
          kpm_kconfig_ready="${ABK_KPM_KCONFIG_READY:-false}"
          kpm_kconfig_path="${ABK_KPM_KCONFIG_PATH:-}"
          test -f "$DEFCONFIG_PATH"

          if [ "$ENABLE_SUSFS" = "true" ]; then
            cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          else
            cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_KSU_SUSFS=n
          CONFIG_KSU_MANUAL_HOOK=y
          EOF
          fi

          cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_HEADERS_INSTALL=n
          EOF

          kpm_config_supported="false"
          if [ "$kpm_kconfig_ready" = "true" ] && [ -f "$kpm_kconfig_path" ]; then
            kpm_config_supported="true"
          else
            for dir in KernelSU/kernel common/drivers/kernelsu drivers/kernelsu kernel; do
              if [ -f "$KERNEL_ROOT/$dir/Kconfig" ] && \
                 grep -Eq '^[[:space:]]*config[[:space:]]+KPM([[:space:]]|$)' "$KERNEL_ROOT/$dir/Kconfig"; then
                kpm_config_supported="true"
                break
              fi
            done
          fi

          if [ "$USE_KPM" = "true" ] && [ "$kpm_config_supported" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_PATH"
            case "$kpm_kconfig_status" in
              native)   echo "检测到原生 KPM Kconfig，已启用 CONFIG_KPM。" ;;
              injected) echo "源码未暴露 KPM Kconfig，已自动注入并启用 CONFIG_KPM。" ;;
              *)        echo "检测到 KPM Kconfig，已启用 CONFIG_KPM。" ;;
            esac
          elif [ "$USE_KPM" = "true" ]; then
            echo "::error::请求启用 KPM，但当前 SukiSU 源码树仍未提供 config KPM。"
            exit 1
          elif [ "$kpm_config_supported" = "true" ]; then
            echo "# CONFIG_KPM is not set" >> "$DEFCONFIG_PATH"
            echo "检测到 KPM Kconfig，已显式关闭 CONFIG_KPM。"
          fi

          if [ "$USE_BBR" = "true" ]; then
            cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_TCP_CONG_BIC=n
          CONFIG_TCP_CONG_WESTWOOD=n
          CONFIG_TCP_CONG_HTCP=n
          EOF
          fi

          if [ "$USE_LZ4KD" = "true" ]; then
            cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_CRYPTO_LZ4KD=y
          CONFIG_CRYPTO_LZ4K_OPLUS=y
          CONFIG_ZRAM_WRITEBACK=y
          EOF
          fi

          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFCONFIG_PATH"

          if [ "$USE_PROXY_OPTIMIZATION" = "true" ]; then
            cat >> "$DEFCONFIG_PATH" <<'EOF'
          CONFIG_BPF_STREAM_PARSER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF
          fi

          sed -i 's/check_defconfig//' "$COMMON_ROOT/build.config.gki" || true

      - name: 写入 DroidSpaces 内核配置
        if: ${{ inputs.enable_droidspaces || inputs.enable_user_ns }}
        shell: bash
        working-directory: oneplus_workspace/kernel_workspace/kernel_platform/common
        run: |
          set -euo pipefail
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          test -f "$DEFCONFIG"

          fail() {
            echo "::error::DroidSpaces 配置: $*"
            exit 1
          }

          # 已启用则跳过；"# X is not set" 则改写；都没有则追加
          enable_config() {
            local cfg="$1"
            if grep -q "^${cfg}=y" "$DEFCONFIG"; then
              echo "  已启用: $cfg"
            elif grep -q "^# ${cfg} is not set" "$DEFCONFIG"; then
              sed -i "s/^# ${cfg} is not set\$/${cfg}=y/" "$DEFCONFIG"
              echo "  已切换: $cfg"
            else
              echo "${cfg}=y" >> "$DEFCONFIG"
              echo "  已添加: $cfg"
            fi
          }

          config_defined() {
            local name="${1#CONFIG_}"
            local file
            while IFS= read -r -d '' file; do
              if grep -Eq "^[[:space:]]*(menuconfig|config)[[:space:]]+${name}([[:space:]]|\$)" "$file"; then
                return 0
              fi
            done < <(find . -type f -name 'Kconfig*' -print0)
            return 1
          }

          enable_required_config() {
            if config_defined "$1"; then
              enable_config "$1"
            else
              fail "当前内核未定义必要配置: $1"
            fi
          }

          enable_config_if_defined() {
            if config_defined "$1"; then
              enable_config "$1"
            else
              echo "  当前内核未定义: $1，跳过"
            fi
          }

          if [ "$ENABLE_DROIDSPACES" = "true" ]; then
            echo "--- DroidSpaces 必要配置 ---"
            enable_required_config CONFIG_SYSVIPC
            enable_required_config CONFIG_POSIX_MQUEUE
            enable_required_config CONFIG_IPC_NS
            enable_required_config CONFIG_PID_NS
            enable_required_config CONFIG_DEVTMPFS

            echo "--- 网络 / NAT ---"
            enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_ADDRTYPE

            echo "--- UFW 支持 ---"
            enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_REJECT
            enable_config_if_defined CONFIG_IP_NF_TARGET_REJECT
            enable_config_if_defined CONFIG_NETFILTER_XT_TARGET_LOG
            enable_config_if_defined CONFIG_NETFILTER_XT_MATCH_RECENT

            echo "--- fail2ban 支持 ---"
            enable_config_if_defined CONFIG_IP_SET
            enable_config_if_defined CONFIG_IP_SET_HASH_IP
            enable_config_if_defined CONFIG_IP_SET_HASH_NET
            enable_config_if_defined CONFIG_NETFILTER_XT_SET

            echo "--- tmpfs xattr / ACL (NixOS) ---"
            enable_config_if_defined CONFIG_TMPFS_POSIX_ACL
            enable_config_if_defined CONFIG_TMPFS_XATTR
          fi

          if [ "$ENABLE_USER_NS" = "true" ]; then
            echo "--- 用户命名空间 (Docker rootless / unsafe procfs 修复) ---"
            enable_required_config CONFIG_USER_NS
          fi

          echo "DroidSpaces 配置写入完成，最终相关项："
          grep -E '^(CONFIG_SYSVIPC|CONFIG_POSIX_MQUEUE|CONFIG_IPC_NS|CONFIG_PID_NS|CONFIG_USER_NS|CONFIG_DEVTMPFS|CONFIG_TMPFS_XATTR|CONFIG_TMPFS_POSIX_ACL)=' \
            "$DEFCONFIG" || true

      - name: 编译内核
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE/oneplus_workspace"
          COMMON_ROOT="$WORKSPACE/kernel_workspace/kernel_platform/common"
          cd "$COMMON_ROOT"

          export PATH="/usr/lib/ccache:$PATH"
          export PATH="$WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin:$PATH"
          export KBUILD_BUILD_USER="abk"
          export KBUILD_BUILD_HOST="abk"
          export KBUILD_BUILD_VERSION=1

          make -j"$(nproc --all)" \
            LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" \
            RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc \
            PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole \
            LD=ld.lld HOSTLD=ld.lld O=out gki_defconfig all \
            KCFLAGS+=-O2

          ccache -s

      - name: 校验 DroidSpaces 配置已生效
        if: ${{ inputs.enable_droidspaces || inputs.enable_user_ns }}
        shell: bash
        working-directory: oneplus_workspace/kernel_workspace/kernel_platform/common
        run: |
          set -euo pipefail
          CONFIG_OUT="out/.config"
          test -f "$CONFIG_OUT" || { echo "::error::未找到 $CONFIG_OUT"; exit 1; }

          missing=0
          check() {
            if grep -q "^$1=y" "$CONFIG_OUT"; then
              echo "  ✓ $1"
            else
              echo "::error::$1 未在最终 .config 中生效（可能被依赖项拒绝）"
              missing=1
            fi
          }

          if [ "$ENABLE_DROIDSPACES" = "true" ]; then
            check CONFIG_SYSVIPC
            check CONFIG_POSIX_MQUEUE
            check CONFIG_IPC_NS
            check CONFIG_PID_NS
            check CONFIG_DEVTMPFS
          fi
          if [ "$ENABLE_USER_NS" = "true" ]; then
            check CONFIG_USER_NS
          fi

          [ "$missing" -eq 0 ] || exit 1
          echo "DroidSpaces 配置校验通过。"

      - name: 打包 AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$GITHUB_WORKSPACE/oneplus_workspace"
          cd "$WORKSPACE"
          git clone https://github.com/Xiaomichael/AnyKernel3 --depth=1
          rm -rf AnyKernel3/.git

          IMAGE_PATH="$(find "$WORKSPACE/kernel_workspace/kernel_platform/common/out" -name Image | head -n 1)"
          if [ -z "$IMAGE_PATH" ]; then
            echo "::error::编译完成后未找到 Image"
            exit 1
          fi
          cp "$IMAGE_PATH" AnyKernel3/Image
          cp "$IMAGE_PATH" Image

          if [ "$USE_KPM" = "true" ]; then
            mkdir -p kpm_patch_temp
            cd kpm_patch_temp
            curl -LO https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
            chmod +x patch_linux
            cp "$WORKSPACE/AnyKernel3/Image" ./Image
            ./patch_linux
            mv oImage "$WORKSPACE/AnyKernel3/Image"
            cd "$WORKSPACE"
            rm -rf kpm_patch_temp
          fi

          artifact_name="${DEVICE_ARTIFACT_ID}_SukiSU_Ultra"
          if [ "$USE_LZ4KD" = "true" ]; then
            artifact_name="${artifact_name}_lz4kd"
          else
            artifact_name="${artifact_name}_base"
          fi
          if [ "$ENABLE_SUSFS" = "true" ]; then
            artifact_name="${artifact_name}_SUSFS"
          fi
          if [ "$ENABLE_DROIDSPACES" = "true" ]; then
            artifact_name="${artifact_name}_DroidSpaces"
          fi
          if [ "$ENABLE_USER_NS" = "true" ]; then
            artifact_name="${artifact_name}_UserNS"
          fi
          artifact_name="${artifact_name}_AnyKernel3"

          cd AnyKernel3
          zip -q -r9 "../${artifact_name}.zip" ./*
          cd "$WORKSPACE"

          echo "ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "IMAGE_ARTIFACT_NAME=${DEVICE_ARTIFACT_ID}_SukiSU_Ultra_raw-image" >> "$GITHUB_ENV"

      - name: 上传 AnyKernel3 刷机包
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: oneplus_workspace/*.zip
          if-no-files-found: error

      - name: 上传内核 Image
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: oneplus_workspace/Image
          if-no-files-found: warn

      - name: 上传最终 .config
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DEVICE_ARTIFACT_ID }}_final-config
          path: oneplus_workspace/kernel_workspace/kernel_platform/common/out/.config
          if-no-files-found: warn
